# NORTEX — CI: tipos + tests + build y smoke del upgrade de schema con MySQL 8.
# El job verify conserva lógica pura; deploy-schema-smoke reproduce una BD
# poblada anterior a PR #158 y exige upgrade/idempotencia/fallo cerrado reales.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=moderate
      - name: Prisma generate (URL dummy — solo tipos)
        run: DATABASE_URL="mysql://u:p@localhost:3306/db" npx prisma generate --schema=backend/prisma/schema.prisma
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npm test

      # Sistema de diseño: cero hex fuera de los tokens, cero símbolo de moneda
      # escrito a mano, solo los 3 radios, nada flotante sobre la zona de cobro.
      # Sin este chequeo el rediseño se deshace solo, un "#8B5CF6 nada más para
      # este badge" a la vez.
      - name: Sistema de diseño
        run: npm run check:design

      # Pruebas de MUTACIÓN sobre los módulos de dinero: no basta con que los
      # tests pasen, tienen que MATAR bugs. Stryker introduce fallas (invierte
      # comparaciones, cambia signos, vacía cuerpos) y falla el CI si un mutante
      # sobrevive por debajo del umbral. Alcance acotado a lógica pura → ~30 s.
      - name: Mutación (Stryker — módulos de dinero)
        run: npm run test:mutation

      # Si el score cae, el reporte HTML dice QUÉ mutante sobrevivió y dónde.
      # Sin esto muere con el runner y hay que reproducir a ciegas en local.
      - name: Reporte de mutación (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
      - name: Build frontend
        run: npm run build

  deploy-schema-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nortex_deploy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: DATABASE_URL="$DATABASE_URL" npx prisma generate --schema=backend/prisma/schema.prisma
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/nortex_deploy_test
      - name: Preparar schema anterior a PR 158
        run: git show afe5ca71aa74f458950acd52b504ecd2701e5a56:backend/prisma/schema.prisma > "$RUNNER_TEMP/schema-before-pr158.prisma"
      - name: Smoke de upgrade con MySQL 8 y datos existentes
        run: scripts/test-deploy-schema-upgrade.sh
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/nortex_deploy_test
          LEGACY_SCHEMA_PATH: ${{ runner.temp }}/schema-before-pr158.prisma
          NORTEX_ALLOW_DESTRUCTIVE_SCHEMA_SMOKE: issue-159-ci-only

  # ── Despliegue con COMPUERTA: solo corre en main y solo si verify +
  # deploy-schema-smoke pasaron. Para que la compuerta sea real, el auto-deploy
  # de Coolify debe estar APAGADO (Coolify → app → desactivar "Auto Deploy"):
  # quien dispara el deploy es este job, vía webhook, nunca el push directo.
  # Cada paso se activa con su secret; sin secrets configurados el job es un
  # no-op inofensivo (el repo no depende de infra que todavía no existe).
  # Orden: staging → smoke de staging (bloquea) → prod → smoke de prod (avisa).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, deploy-schema-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar STAGING (webhook de Coolify)
        env:
          WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "COOLIFY_STAGING_WEBHOOK no configurado — paso omitido"; exit 0; fi
          if [ -n "$TOKEN" ]; then
            curl -fsS -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
          else
            curl -fsS "$WEBHOOK"
          fi
          echo "🚀 Deploy de staging disparado"

      # El smoke de staging BLOQUEA prod: si staging no queda sano, prod no se
      # toca. Espera hasta 8 min (build de imagen + db push + arranque).
      - name: Smoke de STAGING (/api/health)
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
        run: |
          if [ -z "$STAGING_URL" ] || [ -z "$WEBHOOK" ]; then echo "STAGING_URL/webhook no configurados — paso omitido"; exit 0; fi
          for i in $(seq 1 48); do
            if curl -fsS --max-time 10 "$STAGING_URL/api/health" | grep -q '"ok":true'; then
              echo "✅ Staging sano — se habilita prod"; exit 0
            fi
            sleep 10
          done
          echo "❌ Staging NO quedó sano en 8 min — prod NO se despliega"; exit 1

      - name: Desplegar PROD (webhook de Coolify)
        env:
          WEBHOOK: ${{ secrets.COOLIFY_PROD_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "COOLIFY_PROD_WEBHOOK no configurado — paso omitido"; exit 0; fi
          if [ -n "$TOKEN" ]; then
            curl -fsS -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
          else
            curl -fsS "$WEBHOOK"
          fi
          echo "🚀 Deploy de prod disparado"

      # El smoke de prod no puede "bloquear" (ya se desplegó): existe para que
      # el workflow quede ROJO y llegue el correo de GitHub si prod no levantó.
      - name: Smoke de PROD (/api/health)
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          WEBHOOK: ${{ secrets.COOLIFY_PROD_WEBHOOK }}
        run: |
          if [ -z "$PROD_URL" ] || [ -z "$WEBHOOK" ]; then echo "PROD_URL/webhook no configurados — paso omitido"; exit 0; fi
          for i in $(seq 1 48); do
            if curl -fsS --max-time 10 "$PROD_URL/api/health" | grep -q '"ok":true'; then
              echo "✅ Prod sano"; exit 0
            fi
            sleep 10
          done
          echo "❌ Prod NO respondió sano en 8 min — revisar Coolify YA"; exit 1
