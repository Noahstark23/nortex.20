# NORTEX — CI: tipos + tests + build y smoke del upgrade de schema con MySQL 8.
# El job verify conserva lógica pura; deploy-schema-smoke reproduce una BD
# poblada anterior a PR #158 y exige upgrade/idempotencia/fallo cerrado reales.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Permite ejecutar la misma compuerta después de configurar Coolify, sin
  # necesitar un commit vacío ni saltarse las verificaciones de la release.
  workflow_dispatch:

# Un push nuevo invalida cualquier promoción anterior que aún esté verificando
# staging o esperando aprobación de producción. Así nunca se puede aprobar por
# accidente un SHA que ya dejó de ser el HEAD de main.
concurrency:
  group: nortex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=moderate
      - name: Prisma generate (URL dummy — solo tipos)
        run: DATABASE_URL="mysql://u:p@localhost:3306/db" npx prisma generate --schema=backend/prisma/schema.prisma
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npm test

      # Sistema de diseño: cero hex fuera de los tokens, cero símbolo de moneda
      # escrito a mano, solo los 3 radios, nada flotante sobre la zona de cobro.
      # Sin este chequeo el rediseño se deshace solo, un "#8B5CF6 nada más para
      # este badge" a la vez.
      - name: Sistema de diseño
        run: npm run check:design

      # Pruebas de MUTACIÓN sobre los módulos de dinero: no basta con que los
      # tests pasen, tienen que MATAR bugs. Stryker introduce fallas (invierte
      # comparaciones, cambia signos, vacía cuerpos) y falla el CI si un mutante
      # sobrevive por debajo del umbral. Alcance acotado a lógica pura → ~30 s.
      - name: Mutación (Stryker — módulos de dinero)
        run: npm run test:mutation

      # Si el score cae, el reporte HTML dice QUÉ mutante sobrevivió y dónde.
      # Sin esto muere con el runner y hay que reproducir a ciegas en local.
      - name: Reporte de mutación (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
      - name: Build frontend
        run: npm run build

  deploy-schema-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nortex_deploy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: DATABASE_URL="$DATABASE_URL" npx prisma generate --schema=backend/prisma/schema.prisma
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/nortex_deploy_test
      - name: Preparar schema anterior a PR 158
        run: git show afe5ca71aa74f458950acd52b504ecd2701e5a56:backend/prisma/schema.prisma > "$RUNNER_TEMP/schema-before-pr158.prisma"
      - name: Smoke de upgrade con MySQL 8 y datos existentes
        run: scripts/test-deploy-schema-upgrade.sh
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/nortex_deploy_test
          LEGACY_SCHEMA_PATH: ${{ runner.temp }}/schema-before-pr158.prisma
          NORTEX_ALLOW_DESTRUCTIVE_SCHEMA_SMOKE: issue-159-ci-only

  # ── DGI-4 · El backup se PRUEBA, no se supone ────────────────────────────────
  # "Un backup no probado no existe": este job genera un dump real contra MySQL 8,
  # lo restaura en una base desechable y exige que tablas, conteos y acentos
  # coincidan con el origen. Incluye el caso NEGATIVO (un dump truncado debe ser
  # rechazado): sin él, la verificación podría estar pasando por vacía.
  backup-restore-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nortex_backup_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # La contraseña es HOSTIL a propósito: `p#a"ss w@rd` (percent-encoded en la
      # URL, como exige Prisma). Con `root:root` este job pasaba aunque el option
      # file [client] estuviera mal armado, porque ninguna de esas ocho letras
      # toca un caso límite del parser de MySQL. Cada carácter de acá cubre un
      # bug que YA ocurrió o que estaba latente:
      #   `#`  → MySQL lo trata como comienzo de comentario: sin comillas, la
      #          contraseña llegaba TRUNCADA y el backup moría todas las noches.
      #   `"`  → hay que escaparlo dentro del valor citado. Es el único caso que
      #          no se podía verificar sin un MySQL de verdad; ahora el CI lo
      #          prueba en cada corrida.
      #   ` `  → sin comillas MySQL RECORTA los espacios del borde.
      #   `@`  → el parseo de la URL cortaba por el PRIMER `@` y dejaba el host
      #          en basura.
      SOURCE_DATABASE_URL: mysql://respaldo:p%23a%22ss%20w%40rd@127.0.0.1:3306/nortex_backup_test
      RESTORE_DATABASE_URL: mysql://respaldo:p%23a%22ss%20w%40rd@127.0.0.1:3306/nortex_backup_restore_test
      BACKUP_DIR: ${{ github.workspace }}/tmp-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cliente MySQL (mysqldump + mysql)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client

      # El usuario con el que corre el respaldo. Se crea acá y no en el servicio
      # porque la contraseña hostil rompería el `health-cmd` del contenedor, que
      # es una sola línea sin forma cómoda de citarla. El heredoc va con `'SQL'`
      # entre comillas: así bash NO expande nada y el `#`, el `"` y el espacio
      # llegan literales a MySQL.
      - name: Usuario de respaldo con contraseña hostil
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot <<'SQL'
          CREATE USER 'respaldo'@'%' IDENTIFIED BY 'p#a"ss w@rd';
          GRANT ALL PRIVILEGES ON *.* TO 'respaldo'@'%' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          SQL

      - name: Crear el schema real en la BD de origen
        run: |
          npx prisma generate --schema=backend/prisma/schema.prisma
          npx prisma db push --schema=backend/prisma/schema.prisma --skip-generate
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}

      # Tabla de control: prueba que viajan los DATOS (no solo el DDL) y que el
      # utf8mb4 sobrevive. Un dump con charset mal puesto restaura conteos
      # idénticos pero con los acentos rotos — y eso no se nota hasta que un
      # cliente ve su razón social destrozada.
      - name: Sembrar filas de control
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot nortex_backup_test -e "
            CREATE TABLE _backup_smoke (id INT PRIMARY KEY, nota VARCHAR(64)) DEFAULT CHARSET=utf8mb4;
            INSERT INTO _backup_smoke VALUES (1,'fila uno'),(2,'fila dos'),(3,'acentos: ñandú áéíóú');"

      - name: Generar el backup (modo local, sin subir)
        run: bash scripts/backup-db.sh
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
          BACKUP_LOCAL_ONLY: '1'

      - name: El latido de evidencia quedó escrito
        run: |
          test -f "$BACKUP_DIR/last-backup.json" || { echo "::error::No se escribió last-backup.json"; exit 1; }
          cat "$BACKUP_DIR/last-backup.json"
          node -e "const h=require('$BACKUP_DIR/last-backup.json'); if(!h.verificado||h.tablas<10||h.bytes<1024) throw new Error('latido inconsistente: '+JSON.stringify(h));"

      - name: Restaurar y comparar contra el origen
        run: bash scripts/verify-backup-restore.sh "$(ls -t "$BACKUP_DIR"/nortex-*.sql.gz | head -1)"

      - name: Los acentos sobrevivieron al viaje
        run: |
          OBTENIDO="$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -B \
            -e "SELECT nota FROM nortex_backup_restore_test._backup_smoke WHERE id=3;")"
          ESPERADO='acentos: ñandú áéíóú'
          test "$OBTENIDO" = "$ESPERADO" || { echo "::error::utf8 corrupto tras restaurar: '$OBTENIDO' != '$ESPERADO'"; exit 1; }
          echo "✓ $OBTENIDO"

      # Caso NEGATIVO: la verificación tiene que RECHAZAR un dump cortado. Si
      # este paso "pasara", el chequeo de integridad no estaría chequeando nada.
      - name: Un dump truncado debe ser rechazado
        run: |
          BUENO="$(ls -t "$BACKUP_DIR"/nortex-*.sql.gz | head -1)"
          gzip -cd "$BUENO" | head -c 20000 | gzip > "$RUNNER_TEMP/truncado.sql.gz"
          if bash scripts/verify-dump-file.sh "$RUNNER_TEMP/truncado.sql.gz"; then
            echo "::error::La verificación aceptó un dump truncado"; exit 1
          fi
          : > "$RUNNER_TEMP/vacio.sql.gz"
          if bash scripts/verify-dump-file.sh "$RUNNER_TEMP/vacio.sql.gz"; then
            echo "::error::La verificación aceptó un dump vacío"; exit 1
          fi
          echo "✓ Dumps truncado y vacío rechazados."

      # El servicio `backup` del compose tiene que CONSTRUIR. Un Dockerfile roto
      # se descubriría en el deploy, con la app ya desplegada y sin respaldo.
      - name: La imagen del servicio de backup construye
        run: docker build -f Dockerfile.backup -t nortex-backup:ci .

      # Se EJECUTAN, no solo se busca el binario: un `COPY --from` con la ruta
      # equivocada deja un symlink colgante que `command -v` no distingue de uno
      # bueno, y el backup fallaría recién en producción al querer subir el dump.
      - name: Las herramientas de la imagen realmente funcionan
        run: |
          docker run --rm --entrypoint bash nortex-backup:ci -lc \
            'set -e; mysqldump --version; aws --version; command -v gzip; command -v find'

  # ── Despliegue con COMPUERTA: solo corre en main, cuando la variable
  # NORTEX_DEPLOY_ENABLED vale "true", y después de verify + schema smoke.
  # Sin esa variable el job aparece SKIPPED (no como un falso deploy verde).
  # Cuando está habilitado, la configuración faltante falla de forma explícita.
  # Coolify Auto Deploy debe permanecer APAGADO: GitHub es la única compuerta.
  deploy-staging:
    name: deploy-staging
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.NORTEX_DEPLOY_ENABLED == 'true'
    needs: [verify, deploy-schema-smoke, backup-restore-smoke]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar configuración de STAGING
        env:
          WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          APP_URL: ${{ vars.STAGING_URL }}
        run: |
          test -n "$WEBHOOK" || { echo "::error::Falta COOLIFY_STAGING_WEBHOOK"; exit 1; }
          test -n "$APP_URL" || { echo "::error::Falta la variable STAGING_URL"; exit 1; }
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::STAGING_URL debe usar https://"; exit 1 ;;
          esac

      - name: Desplegar STAGING (webhook de Coolify)
        env:
          WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            curl --fail --show-error --silent --max-time 30 --retry 3 \
              -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
          else
            curl --fail --show-error --silent --max-time 30 --retry 3 "$WEBHOOK"
          fi
          echo "🚀 Deploy de staging disparado"

      # No basta con que staging esté sano: tiene que servir ESTE commit. Así un
      # webhook roto o un deploy que no avanzó nunca habilita producción.
      - name: Verificar STAGING sano y en el commit esperado
        env:
          APP_URL: ${{ vars.STAGING_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployed-release.mjs "$APP_URL" "$EXPECTED_COMMIT"

  deploy-production:
    name: deploy-production
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.NORTEX_DEPLOY_ENABLED == 'true'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar configuración de PROD
        env:
          WEBHOOK: ${{ secrets.COOLIFY_PROD_WEBHOOK }}
          APP_URL: ${{ vars.PROD_URL }}
        run: |
          test -n "$WEBHOOK" || { echo "::error::Falta COOLIFY_PROD_WEBHOOK"; exit 1; }
          test -n "$APP_URL" || { echo "::error::Falta la variable PROD_URL"; exit 1; }
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::PROD_URL debe usar https://"; exit 1 ;;
          esac

      - name: Desplegar PROD (webhook de Coolify)
        env:
          WEBHOOK: ${{ secrets.COOLIFY_PROD_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            curl --fail --show-error --silent --max-time 30 --retry 3 \
              -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
          else
            curl --fail --show-error --silent --max-time 30 --retry 3 "$WEBHOOK"
          fi
          echo "🚀 Deploy de prod disparado"

      - name: Verificar PROD sano y en el commit esperado
        env:
          APP_URL: ${{ vars.PROD_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployed-release.mjs "$APP_URL" "$EXPECTED_COMMIT"
