name: Android (APK/AAB)

# Compila la app Android EN LA NUBE (los runners de GitHub traen el Android SDK).
# Así el APK se genera sin instalar nada localmente: se descarga de la pestaña
# Actions → esta corrida → Artifacts. Ideal para probar en un teléfono.
#
# - `workflow_dispatch`: botón manual "Run workflow" en la pestaña Actions.
# - push a la rama de la app o a main tocando lo móvil: build automático.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/app-android]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
      - 'src/**'
      - 'components/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Construir la web y sincronizar a Android
        run: |
          DATABASE_URL="mysql://u:p@localhost:3306/db" npx prisma generate --schema=backend/prisma/schema.prisma
          npm run build
          npx cap sync android

      # ── APK de DEBUG: instalable en cualquier teléfono para probar ──────────
      # Firmado con la clave de debug de Android (no sirve para la tienda, sí
      # para instalarlo a mano y probar la app en un dispositivo real).
      - name: Compilar APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: android

      - name: Publicar el APK debug
        uses: actions/upload-artifact@v4
        with:
          name: nortex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ── AAB de RELEASE (para la Play Store): solo si cargaste el keystore ───
      # Requiere estos Secrets del repo (Settings → Secrets and variables →
      # Actions):
      #   ANDROID_KEYSTORE_BASE64  → tu .keystore codificado en base64
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Si no están, este paso se salta (no rompe el build).
      # Nunca interpolamos ${{ secrets.* }} dentro del cuerpo de un `run:` (el
      # texto del script queda en el log y el enmascarado es frágil con base64
      # multilínea). Lo pasamos por `env:` y lo leemos como $VAR.
      - name: ¿Hay keystore configurado?
        id: keycheck
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Sin ANDROID_KEYSTORE_BASE64 → se omite el AAB de release (solo se generó el APK debug)."
          fi

      - name: Reconstruir keystore desde el Secret
        if: steps.keycheck.outputs.present == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # printf '%s' (no `echo`) para no interpretar secuencias; codificá el
        # keystore con `base64 -w0` (una sola línea) al cargar el Secret.
        run: printf '%s' "$KS_B64" | base64 -d > android/app/nortex-release.keystore

      - name: Compilar AAB release firmado
        if: steps.keycheck.outputs.present == 'true'
        working-directory: android
        env:
          NORTEX_KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NORTEX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NORTEX_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=nortex-release.keystore \
            -Pandroid.injected.signing.store.password="$NORTEX_KS_PW" \
            -Pandroid.injected.signing.key.alias="$NORTEX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$NORTEX_KEY_PW"

      - name: Publicar el AAB de release
        if: steps.keycheck.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nortex-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
