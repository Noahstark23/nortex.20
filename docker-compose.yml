version: '3.8'
services:
  db:
    image: 'mysql:8.0'
    command: '--default-authentication-plugin=mysql_native_password'
    restart: always
    environment:
      # Sin default inseguro: compose falla si DB_ROOT_PASSWORD no está definido.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD (sin default inseguro)}
      MYSQL_DATABASE: nortex_db
    # SIN `ports`: la base de datos NO se publica al host/internet. El servicio
    # `app` la alcanza por la red interna de compose (db:3306). Antes 3306 estaba
    # expuesto al mundo — brecha crítica.
    volumes:
      - 'mysql_data:/var/lib/mysql'
    # Healthcheck: `app` espera a que MySQL esté LISTO (no solo que el contenedor
    # exista) vía `depends_on: condition: service_healthy`. Elimina el race de
    # primer arranque que tumbaba la app en bucle. start_period cubre el init
    # inicial de MySQL 8 (crea el datadir la primera vez).
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${DB_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  # phpMyAdmin solo bajo demanda (perfil "debug"); NO se levanta en producción.
  # Uso puntual:  docker compose --profile debug up phpmyadmin
  # Además, su puerto se publica solo en localhost (usar túnel SSH para acceder).
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    profiles: ["debug"]
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:8081:80'
    depends_on:
      - db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://root:${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD}@db:3306/nortex_db
      # ── Cobro ──────────────────────────────────────────────────────────────
      # Stripe NO soporta Nicaragua como país de comercio: el rail real de cobro
      # es depósito/transferencia con comprobante. Estas variables se leen en el
      # código desde siempre, pero no estaban declaradas acá ni en ningún script
      # de deploy, así que en producción llegaban vacías: parseBankAccounts()
      # devolvía [] y la pantalla de pago no mostraba NINGUNA cuenta a la cual
      # transferir — el cliente que quería pagar no tenía cómo.
      #
      # BANK_ACCOUNTS_JSON: arreglo JSON en una línea. Ejemplo:
      #   [{"bank":"BAC","type":"Cuenta corriente USD","number":"...","name":"NORTEX"}]
      # Si falta o viene malformado, el frontend cae al canal de WhatsApp.
      - BANK_ACCOUNTS_JSON=${BANK_ACCOUNTS_JSON:-}
      # Destino del aviso "entró un pago por revisar" (la activación es manual).
      - BILLING_ALERT_EMAIL=${BILLING_ALERT_EMAIL:-}
      - SUPPORT_WHATSAPP=${SUPPORT_WHATSAPP:-}
    # Espera a que MySQL pase el healthcheck antes de arrancar (belt-and-suspenders
    # junto al wait del entrypoint, por si Coolify no honra la condición).
    depends_on:
      db:
        condition: service_healthy

  # ── Backup diario off-site (DGI-4 · Capa 6 del Security & Integrity Loop) ────
  # Vive ACÁ y no en un cron del host por dos razones concretas:
  #   1. `db` no publica puertos y el nombre `db` solo resuelve dentro de esta
  #      red — un cron del host NO puede alcanzar la base para hacer el dump.
  #   2. Un cron del host hay que instalarlo a mano en cada servidor; esto se
  #      despliega con la app y no se puede olvidar.
  # Si faltan las credenciales del bucket, ESTE servicio se cae ruidosamente
  # (visible en Coolify) pero la app sigue vendiendo: un respaldo mal configurado
  # no puede tumbar el punto de venta del cliente.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: on-failure:3
    environment:
      - DATABASE_URL=mysql://root:${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD (sin default inseguro)}@db:3306/nortex_db
      - TZ=${TZ:-America/Managua}
      - BACKUP_HOUR=${BACKUP_HOUR:-03}
      - BACKUP_MINUTE=${BACKUP_MINUTE:-15}
      # Destino SEPARADO del Droplet. Sin esto no hay respaldo real: un dump que
      # queda en el mismo disco que la base se pierde con la base.
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # Aviso inmediato si un backup falla (Slack/Discord/webhook genérico).
      - BACKUP_ALERT_WEBHOOK=${BACKUP_ALERT_WEBHOOK:-}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
    volumes:
      - 'backup_data:/var/backups/nortex'
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  # Dumps locales + el latido `last-backup.json` (evidencia del último respaldo
  # bueno). La copia que importa es la del bucket; esta es la de mano.
  backup_data:
